# HerPulse 方法A：本地采集 Reddit → push → GitHub Actions 自动跑 AO3 + 后半段 + Pages
# 触发条件：
#   1. 推送 herpulse/data/ 目录变更到 main 分支（你本地采集后 push 上来）
#   2. 手动点击 Run workflow
#
# 你需要在本地做的（每天一次）：
#   cd e:/HerPulse/herpulse
#   bash deploy/fetch_only.sh
#   git add data/ && git commit -m "data: $(date +%Y%m%d)" && git push
#
# 前置设置：
#   Settings → Secrets → Actions → 新建 HERPULSE_LLM_API_KEY（DeepSeek key）
#   Settings → Pages → Source 选 "GitHub Actions"

name: HerPulse Build Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'herpulse/data/**'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch AO3
        run: bash herpulse/deploy/fetch_only.sh ao3
        continue-on-error: true

      - name: Upload raw corpus
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: herpulse-corpus
          path: |
            herpulse/data/corpus_reddit_*.json
            herpulse/data/fanwork_ao3_*.json
          retention-days: 30

      - name: Build dashboard
        id: build
        env:
          HERPULSE_LLM_API_KEY: ${{ secrets.HERPULSE_LLM_API_KEY }}
        run: |
          cd herpulse
          bash deploy/run_local.sh
        continue-on-error: true

      - name: Prepare Pages
        if: always()
        run: |
          mkdir -p _site
          if [ -f herpulse-dashboard-live.html ]; then
            cp herpulse-dashboard-live.html _site/index.html
          else
            cat > _site/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
            <meta charset="utf-8">
            <title>HerPulse — 构建失败</title>
            <style>
              body { font-family: system-ui, sans-serif; max-width: 600px; margin: 80px auto; padding: 0 20px; color: #333; }
              h1 { color: #c0392b; }
              code { background: #f4f4f4; padding: 2px 6px; border-radius: 4px; }
            </style>
          </head>
          <body>
            <h1>HerPulse 看板构建失败</h1>
            <p>可能的原因：</p>
            <ul>
              <li>未找到 Reddit 语料文件（请先本地采集并 push）</li>
              <li>DeepSeek API key 未配置或额度不足</li>
            </ul>
            <p>请检查 <a href="https://github.com/alpha041027/Trending-topics/actions">Actions 日志</a>。</p>
          </body>
          </html>
          EOF
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
