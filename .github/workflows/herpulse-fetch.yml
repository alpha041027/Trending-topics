# HerPulse 海外采集（GitHub Actions 免费海外 runner，只采集不出海后半段）
# 产物：herpulse/data/corpus_reddit_*.json + fanwork_ao3_*.json（Artifacts 下载回本地）
# 注意：runner 是数据中心 IP，Reddit 极易 403/429，AO3 通常正常。
#      Reddit 失败不会阻断 AO3，确保至少有一份数据落盘。

name: HerPulse Overseas Fetch

on:
  schedule:
    - cron: '0 1 * * *'   # 每天 UTC 01:00（北京时间 09:00）
  workflow_dispatch: {}   # 支持手动触发

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch Reddit
        run: bash herpulse/deploy/fetch_only.sh reddit
        continue-on-error: true

      - name: Fetch AO3
        run: bash herpulse/deploy/fetch_only.sh ao3

      - name: Upload corpus
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: herpulse-corpus
          path: |
            herpulse/data/corpus_reddit_*.json
            herpulse/data/fanwork_ao3_*.json
          retention-days: 30
